<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plán mailingů</title>
<meta name="theme-color" content="#e8ecf1">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mailingy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Layout: týdenní nástěnka (7 sloupců → 1 sloupec na mobilu) + měsíční kalendář; barvy Centrale Clinique (námořní modrá + zlatá) */
:root{
  --bg:#ffffff; --band:#e8ecf1; --surface:#ffffff; --tile:#f5f5f5; --line:#ebe4d2; --ink:#243a63; --muted:#6f7c94;
  --accent:#e0cd9c; --accent-ink:#c8b27a; --on-accent:#ffffff; --accent-soft:#f8f2e2;
  --done:#4d8a2b; --done-soft:#edf5e6; --warn:#b45309;
  --display:"Poppins",system-ui,sans-serif; --body:"Poppins",system-ui,sans-serif; --mono:"Poppins",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-inline:max(16px,env(safe-area-inset-left));padding-block:calc(20px + env(safe-area-inset-top)) calc(48px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1400px;margin:0 auto;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:var(--band);border-radius:14px;padding:16px 18px}
h1{font:700 clamp(24px,4vw,32px)/1.1 var(--display);margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.tabs{display:flex;gap:6px}
.tabs button{border:2px solid var(--accent);background:none;color:var(--accent-ink);font:600 14px var(--body);padding:7px 18px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.nav{display:flex;align-items:center;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px var(--body);padding:7px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700;border-radius:2px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding:4px 8px}
.btn.ghost:hover{color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.range{font:600 17px var(--display);min-width:0}
.progress{margin-left:auto;font:500 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.notice{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:14px}
.notice[data-kind="warn"]{color:var(--warn)}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
@media (max-width:1100px){.week{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.week{grid-template-columns:1fr}}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.dname{font:700 16px var(--display);color:var(--ink)}
.ddate{font:500 12px var(--mono);color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--tile);display:flex;flex-direction:column}
.item.done{background:var(--done-soft);border-color:transparent}
.item img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:var(--tile);padding:8px}
.ibody{padding:9px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.itext{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.item.done .itext{text-decoration:line-through;color:var(--muted)}
.ilink{font:500 12px var(--mono);color:var(--accent-ink);overflow-wrap:anywhere;text-decoration:none}
.ilink:hover{text-decoration:underline}
.iact{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.check{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer;margin-right:auto}
.check input{width:17px;height:17px;accent-color:var(--done)}
.empty{color:var(--muted);font-size:13px;padding:4px 0}
.add{border:1px dashed var(--line);background:none;color:var(--muted);border-radius:9px;padding:8px;font:500 13px var(--body);cursor:pointer}
.add:hover{color:var(--accent-ink);border-color:var(--accent)}

form.edit{display:flex;flex-direction:column;gap:8px;border:1px solid var(--accent);border-radius:10px;padding:10px;background:var(--surface)}
form.edit input[type=text]{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:14px var(--body);padding:7px 9px}
.hint{font-weight:400;letter-spacing:0}
.parsed{display:flex;flex-direction:column;gap:2px;background:var(--tile);border-radius:7px;padding:8px 10px;font-size:14px;overflow-wrap:anywhere}
.parsed span{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
form.edit label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
form.edit textarea,form.edit input[type=url]{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:14px var(--body);padding:7px 9px}
form.edit textarea{min-height:64px;resize:vertical}
.drop{border:1px dashed var(--line);border-radius:8px;padding:10px;text-align:center;font-size:12px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center}
.drop.over{border-color:var(--accent);color:var(--accent-ink)}
.drop img{max-height:120px;width:auto;border-radius:6px}
.row{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}

.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{font:600 12px var(--body);color:var(--muted);text-align:center;letter-spacing:.04em;text-transform:uppercase}
.cell{min-height:78px;border:1px solid var(--line);border-radius:9px;padding:6px;display:flex;flex-direction:column;gap:4px;background:var(--tile);cursor:pointer;text-align:left;color:var(--ink);font:inherit;min-width:0}
.cell:hover{border-color:var(--accent)}
.cell.out{opacity:.4}
.cell.today{border-color:var(--accent)}
.cell.all{background:var(--done-soft);border-color:transparent}
.cell.part{background:var(--accent-soft);border-color:transparent}
.cnum{font:600 13px var(--mono)}
.cstat{font:500 11px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.cell.all .cstat{color:var(--done)}
.cnames{font-size:11px;line-height:1.3;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
@media (max-width:620px){.cell{min-height:52px;padding:4px}.cnames{display:none}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--sw)}
.status{font-size:12px;color:var(--muted)}
.pin{max-width:360px;margin:12vh auto 0;display:grid;gap:12px;text-align:center}
.pin input{font:600 22px var(--body);text-align:center;letter-spacing:.3em;border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--ink);background:var(--bg)}
.drop .rm{font-size:12px}
input,textarea{font-size:16px!important}
</style>
</head>
<body>

<form class="pin" id="pinform" hidden>
  <h1>Plán mailingů</h1>
  <label for="pin-in" class="sub">Zadejte PIN</label>
  <input id="pin-in" type="password" inputmode="numeric" autocomplete="current-password">
  <button class="btn primary" type="submit">Vstoupit</button>
  <div class="notice" id="pin-err" data-kind="warn" hidden>Špatný PIN.</div>
</form>
<div class="wrap" id="app">
  <header>
    <div>
      <h1>Plán mailingů</h1>
      <p class="sub">Firmy a produkty na každý den. Co je hotové, se ukládá do kalendáře.</p>
    </div>
    <div class="tabs" role="tablist">
      <button id="tab-week" role="tab" aria-selected="true">Týden</button>
      <button id="tab-cal" role="tab" aria-selected="false">Kalendář</button>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>

  <section id="view-week" class="wrap" style="gap:14px">
    <div class="bar">
      <div class="nav">
        <button class="btn" id="prevW" aria-label="Předchozí týden">←</button>
        <button class="btn" id="todayW">Tento týden</button>
        <button class="btn" id="nextW" aria-label="Další týden">→</button>
      </div>
      <div class="range" id="range"></div>
      <div class="progress" id="wprog"></div>
    </div>
    <div class="week" id="week"></div>
  </section>

  <section id="view-cal" hidden>
    <div class="cal">
      <div class="bar">
        <div class="nav">
          <button class="btn" id="prevM" aria-label="Předchozí měsíc">←</button>
          <button class="btn" id="nextM" aria-label="Další měsíc">→</button>
        </div>
        <div class="range" id="mlabel"></div>
        <div class="progress" id="mprog"></div>
      </div>
      <div class="calgrid" id="calgrid"></div>
      <div class="legend">
        <span style="--sw:var(--done-soft)">Vše odesláno</span>
        <span style="--sw:var(--accent-soft)">Rozpracováno</span>
        <span style="--sw:var(--tile)">Nic naplánováno</span>
      </div>
    </div>
  </section>
</div>

<script src="/app.js"></script>
</body>
</html>
